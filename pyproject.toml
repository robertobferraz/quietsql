[project]
name = "quietsql"
version = "0.1.0"
description = "Ask questions about local data in plain language. Nothing leaves your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.3",
  "sqlglot>=27",
  "nicegui>=2.20",
  "plotly>=6",
  "llama-cpp-python==0.3.16",
  "ctranslate2>=4.5",
  "sentencepiece>=0.2",
  "lingua-language-detector>=2.1",
  "huggingface-hub>=0.34",
]

[project.scripts]
quietsql = "quietsql.cli:main"

[project.optional-dependencies]
convert = [
  "transformers>=4.40",
  "torch>=2.2",
]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-socket>=0.7",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quietsql"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--disable-socket --allow-unix-socket -q"
asyncio_mode = "auto"
testpaths = ["tests"]
main_file = ""
markers = [
  "slow: loads a real model",
  "accuracy: the 30-case accuracy suite against a real model, about 70 s",
  "network: opens the internet",
]
